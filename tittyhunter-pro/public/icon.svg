<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d"/>
      <stop offset="50%" stop-color="#d300c5"/>
      <stop offset="100%" stop-color="#05d9e8"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1a1a2e" stroke-width="4"/>

  <!-- Glowing Outer Triangle / Pyramid (Pyrm) -->
  <polygon points="256,70 430,390 82,390" fill="none" stroke="url(#neonPink)" stroke-width="18" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Inner Eye / Lens / Search Ring -->
  <circle cx="256" cy="275" r="70" fill="#070712" stroke="#05d9e8" stroke-width="12" filter="url(#neonGlow)"/>
  <circle cx="256" cy="275" r="32" fill="#ff2a6d"/>
  
  <!-- Magnifying Handle -->
  <line x1="305" y1="324" x2="370" y2="390" stroke="#05d9e8" stroke-width="16" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Text "PYRM" -->
  <text x="256" y="455" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="8">PYRMSEARCH</text>
</svg>
